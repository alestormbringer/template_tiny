services:
  factory:
    build:
      context: ./factory
      dockerfile: Dockerfile
    container_name: template-factory
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - agents-data:/root/workspace
    ports:
      - "127.0.0.1:${FACTORY_PORT:-8090}:3778"
    networks:
      - factory-net
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    volumes:
      - ./searxng:/etc/searxng
    networks:
      - factory-net

networks:
  factory-net:
    driver: bridge

volumes:
  # Same volume as the old stack: legacy pipeline.json is preserved untouched;
  # the new pipeline writes to pipeline_v2.json. Never delete this volume.
  agents-data:
